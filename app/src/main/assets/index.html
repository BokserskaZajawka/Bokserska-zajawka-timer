<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bokserska Zajawka Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#10131b;color:#fff;font-family:Arial,sans-serif;text-align:center}h1{color:#ffb52e;font-size:27px}h2{font-size:16px;color:#ddd}.panel{max-width:430px;margin:auto;background:#202635;padding:20px;border-radius:18px}label{display:block;text-align:left;margin-top:14px;color:#ddd}select,button{width:100%;padding:13px;margin-top:7px;border:0;border-radius:9px;font-size:17px}select{background:#fff;color:#111}#time{font-size:76px;font-weight:bold;margin:25px 0;color:#ffb52e}#phase{font-size:22px;min-height:30px}.buttons{display:flex;gap:8px}.buttons button{font-weight:bold}.start{background:#28bd70;color:#07180e}.pause{background:#ffc247;color:#171000}.reset{background:#f05a55;color:white}#combo{min-height:48px;margin:20px 0;font-size:21px;color:#fff}
</style></head><body><h1>🥊 BOKSERSKA ZAJAWKA</h1><h2>ROUND TIMER</h2><div class="panel">
<label>Poziom</label><select id="level"><option value="początkujący">Początkujący</option><option value="zaawansowany">Zaawansowany</option></select>
<label>Runda</label><select id="roundLen"><option value="180">3 minuty</option><option value="120">2 minuty</option></select>
<label>Przerwa</label><select id="restLen"><option value="60">60 sekund</option><option value="30">30 sekund</option></select>
<label>Komendy głosowe</label><select id="voiceEvery"><option value="0">Wyłączone</option><option value="5">Co 5 sekund</option><option value="10" selected>Co 10 sekund</option><option value="15">Co 15 sekund</option><option value="20">Co 20 sekund</option><option value="30">Co 30 sekund</option></select>
<div id="phase">Gotowy do treningu?</div><div id="time">03:00</div><div id="combo">Wybierz ustawienia i naciśnij START</div><div class="buttons"><button class="start" onclick="startTimer()">START</button><button class="pause" onclick="pauseTimer()">PAUZA</button><button class="reset" onclick="resetTimer()">RESET</button></div></div>
<script>
let remaining=180, timer=null, rest=false, elapsed=0, roundNo=1;
const $=id=>document.getElementById(id);
function show(){let m=Math.floor(remaining/60),s=remaining%60;$('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('phase').textContent=rest?'PRZERWA':'RUNDA '+roundNo;}
function speak(t){try{if(window.AndroidTTS&&typeof window.AndroidTTS.speak==='function'){window.AndroidTTS.speak(t);return;}if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';speechSynthesis.speak(u);}}catch(e){}}
function startTimer(){if(timer!==null)return;if(remaining<=0)resetTimer();$('phase').textContent=rest?'PRZERWA':'RUNDA '+roundNo;timer=setInterval(tick,1000);}
function pauseTimer(){if(timer!==null){clearInterval(timer);timer=null;}$('combo').textContent='Pauza';}
function resetTimer(){if(timer!==null)clearInterval(timer);timer=null;rest=false;elapsed=0;roundNo=1;remaining=Number($('roundLen').value);$('phase').textContent='Gotowy do treningu?';$('combo').textContent='Wybierz ustawienia i naciśnij START';show();}
function tick(){remaining--;elapsed++;show();let freq=Number($('voiceEvery').value);if(!rest&&freq>0&&elapsed%freq===0){let moves=['Lewy prosty','Prawy prosty','Lewy-prawy','Unik i lewy prosty','Lewy, prawy, lewy'];let choices=$('level').value==='zaawansowany'?moves:moves.slice(0,3);let c=choices[Math.floor(Math.random()*choices.length)];$('combo').textContent=c;speak(c);}if(remaining<=0){if(!rest){rest=true;remaining=Number($('restLen').value);$('combo').textContent='Koniec rundy. Przerwa.';speak('Koniec rundy. Przerwa.');}else{rest=false;roundNo++;remaining=Number($('roundLen').value);$('combo').textContent='Koniec przerwy. Zaczynamy rundę.';speak('Koniec przerwy. Zaczynamy rundę.');}elapsed=0;show();}}
$('roundLen').addEventListener('change',()=>{if(!rest&&timer===null){remaining=Number($('roundLen').value);show();}});$('restLen').addEventListener('change',()=>{if(rest&&timer===null){remaining=Number($('restLen').value);show();}});show();
</script></body></html>
